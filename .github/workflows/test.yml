name: Test Pipeline
on:
  workflow_call:

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build image for testing
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Containerfile
          target: test
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No secret and no database are mounted: the root conftest.py generates a
      # throwaway signing key when none is configured, which is what lets the
      # suite run on a bare checkout.
      - name: Pytest run
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:ci-test
